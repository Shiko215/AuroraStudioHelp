        function bindScrollSpy() {
            const contentArea = document.querySelector('.content-area');
            const sections = document.querySelectorAll('.section-anchor');
            
            contentArea.onscroll = () => {
                let current = "";
                sections.forEach((section) => {
                    const sectionTop = section.offsetTop;
                    if (contentArea.scrollTop >= sectionTop - 250) {
                        current = section.getAttribute("id");
                    }
                });

                document.querySelectorAll('.nav-link').forEach((link) => {
                    link.classList.remove("active");
                    if (link.getAttribute("href").includes(current)) {
                        link.classList.add("active");
                    }
                });
            };
        }

        window.onload = () => {
            // 自動偵測中國大陸地區玩家 (基於時區或瀏覽器語言)
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const lang = navigator.language || navigator.userLanguage;
                // 若時區為上海/重慶，或系統語言設定為簡體中文，自動切換至 Bilibili，並預設套用簡體中文
                if (tz === 'Asia/Shanghai' || tz === 'Asia/Chongqing' || lang.startsWith('zh-CN')) {
                    state.videoPlatform = 'bilibili';
                    state.lang = 'zh_cn';
                }
            } catch (e) {
                console.warn("地理位置偵測失敗，套用預設 YouTube", e);
            }
            
            renderApp();
        };
